# profiles/slurm/config.yaml

executor: slurm


jobs: 100


default-resources:
  partition: short
  mem_mb: 2000
  time: "00:30:00"
  cpus: 1


slurm:
  partition: "{resources.partition}"
  time: "{resources.time}"
  cpus-per-task: "{resources.cpus}"
  mem: "{resources.mem_mb}"
  gres: "{resources.gres}"
  mail-user: "phoebe.freeston@biology.ox.ac.uk"
  mail-type: "BEGIN,END,FAIL"
  job-name: "af3_{rule}_{wildcards.name}"


printshellcmds: true
keep-going: true
rerun-incomplete: true
latency-wait: 60


max-jobs-per-second: 5
max-status-checks-per-second: 10